name: Plus macOS

# Unsigned personal build of OpenMausBot Plus for Apple Silicon only.
# Ad-hoc signed so it launches beside the official app. No notarization, no
# Intel dmg, no electron-updater feed (app-update.yml). Plus finds updates on
# its own (electron/plus-updater.mjs) through the plus-update.json manifest
# this workflow publishes on a plus-* release of this fork.
on:
  workflow_dispatch:
    inputs:
      plus_build:
        description: "Plus build number on this upstream version (version becomes <upstream>-plus.<n>)"
        default: "1"
        required: true
      publish:
        description: "Publish the dmg and plus-update.json as a plus-* release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  mac:
    name: macOS arm64 (unsigned Plus)
    runs-on: macos-14
    timeout-minutes: 120
    env:
      OMB_PLUS: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set the Plus version
        id: version
        run: |
          set -euo pipefail
          base=$(node -p "require('./package.json').version.split('-')[0]")
          n="${{ inputs.plus_build || '1' }}"
          case "$n" in (*[!0-9]*|'') echo "::error::plus_build must be a number"; exit 1;; esac
          v="$base-plus.$n"
          npm pkg set version="$v"
          if [ "$n" = 1 ]; then tag="plus-$base"; else tag="plus-$v"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Plus $v -> $tag"
      - name: "Gate: Plus config covers every official macOS resource"
        run: node scripts/plus-config-check.mjs
      - run: node --test electron/plus-build.node-test.mjs electron/plus-updater.node-test.mjs
      - name: Clean generated output
        run: rm -rf dist dist-server dist-native release

      - name: Build the app, helpers, and Plus marker
        run: |
          pnpm package:prepare
          pnpm build:speech
          pnpm build:cua
          node scripts/write-plus-marker.mjs

      - name: Package the arm64 app
        run: pnpm exec electron-builder --mac dir --arm64 --publish never --config electron-builder.plus.yml

      - name: Ad-hoc sign the app
        run: |
          set -euo pipefail
          app="release/mac-arm64/OpenMausBot Plus.app"
          codesign --force --deep -s - "$app"
          codesign --verify --deep --strict "$app"

      - name: Pack the arm64 UDBZ dmg
        run: pnpm exec electron-builder --mac dmg --arm64 --prepackaged "release/mac-arm64/OpenMausBot Plus.app" --publish never --config electron-builder.plus.yml

      - name: "Gate: Plus identity, no update feed, bundled tools, single-arch natives"
        run: |
          set -euo pipefail
          v=$(node -p "require('./package.json').version")
          app="release/mac-arm64/OpenMausBot Plus.app"
          res="$app/Contents/Resources"
          plist="$app/Contents/Info.plist"
          lipo_arch=arm64
          test -d "$app" || { echo "::error::missing $app"; exit 1; }
            id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
            test "$id" = "com.openmausbot.app.plus" || { echo "::error::$app bundle id is $id"; exit 1; }
            name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")
            test "$name" = "OpenMausBot Plus" || { echo "::error::$app name is $name"; exit 1; }
            if /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes' "$plist" >/dev/null 2>&1; then
              echo "::error::$app registers a URL scheme"; exit 1
            fi
            test ! -f "$res/app-update.yml" || { echo "::error::$app ships an update feed"; exit 1; }
            test -f "$res/app.asar" || { echo "::error::$app is not packed into asar"; exit 1; }
            asar_js=$(find node_modules -path '*@electron/asar/bin/asar.js' | head -1)
            test -n "$asar_js" || { echo "::error::@electron/asar CLI not installed"; exit 1; }
            listing=$(node "$asar_js" list "$res/app.asar")
            if printf '%s\n' "$listing" | grep -E '(^|/)node_modules/|\.map$|\.tsbuildinfo$'; then
              echo "::error::$app asar still contains node_modules, source maps, or build info"; exit 1
            fi
            test -f "$res/server/index.js" || { echo "::error::missing server in $app"; exit 1; }
            test -f "$res/server/plus-build.json" || { echo "::error::missing Plus marker in $app"; exit 1; }
            test -f "$res/ui/index.html" || { echo "::error::missing ui in $app"; exit 1; }
            test -d "$res/skills" || { echo "::error::missing skills in $app"; exit 1; }
            test -d "$res/companion" || { echo "::error::missing companion in $app"; exit 1; }
            test -x "$res/cloudflared/cloudflared" || { echo "::error::missing cloudflared in $app"; exit 1; }
            test -f "$res/licenses/cloudflared-LICENSE.txt" || { echo "::error::missing cloudflared license in $app"; exit 1; }
            test -x "$res/browser-engine/agent-browser" || { echo "::error::missing browser engine in $app"; exit 1; }
            test -x "$res/cua-driver" || { echo "::error::missing cua driver in $app"; exit 1; }
            test -d "$res/cua-sdk" || { echo "::error::missing cua sdk in $app"; exit 1; }
            test -x "$res/android-platform-tools/darwin/adb" || { echo "::error::missing android tools in $app"; exit 1; }
            speech="$res/OpenMausBot Speech.app/Contents/MacOS/speech-helper"
            test -x "$speech" || { echo "::error::missing speech helper in $app"; exit 1; }
            speech_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$res/OpenMausBot Speech.app/Contents/Info.plist")
            test "$speech_id" = "com.openmausbot.app.plus.speech-helper" || { echo "::error::speech bundle id is $speech_id"; exit 1; }
            for bin in "$speech" "$res/cua-driver" "$res/cloudflared/cloudflared" "$res/android-platform-tools/darwin/adb"; do
              test "$(lipo -archs "$bin")" = "$lipo_arch" || { echo "::error::$bin is not $lipo_arch only"; exit 1; }
            done
          OMB_SMOKE_DIST="$res/server" node scripts/smoke-packaged-server.mjs \
            || { echo "::error::packaged server in $app failed to start"; exit 1; }
          test -f "release/OpenMausBot-Plus-$v-arm64.dmg" || { echo "::error::missing arm64 dmg"; exit 1; }
          if ls release/OpenMausBot-Plus-*-x64.dmg >/dev/null 2>&1; then
            echo "::error::Intel dmg was produced"; exit 1
          fi
          echo "ok: arm64 $app"
          echo "dmg size:"
          ls -l "release/OpenMausBot-Plus-$v-arm64.dmg"

      - name: "Gate: signed native browser works with an empty home"
        run: |
          resources="$PWD/release/mac-arm64/OpenMausBot Plus.app/Contents/Resources"
          node scripts/smoke-browser-bundle.mjs --resources "$resources"
          OMB_SMOKE_DIST="$resources/server" node scripts/smoke-packaged-server.mjs --browser-bundle "$resources/browser-engine"

      - name: "Gate: no Intel or foreign-platform native code anywhere in the app"
        run: |
          set -euo pipefail
          app="release/mac-arm64/OpenMausBot Plus.app"
          bad=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              archs=$(lipo -archs "$f" 2>/dev/null || true)
              case " $archs " in (*x86_64*) echo "::error::$f carries $archs"; bad=1;; esac
            elif file -b "$f" | grep -qE '^(ELF|PE32)'; then
              echo "::error::$f is a non-macOS binary"; bad=1
            fi
          done < <(find "$app" -type f \( -perm -u+x -o -name '*.node' -o -name '*.dylib' -o -name '*.so' -o -name '*.dll' -o -name '*.exe' \) -print0)
          exit $bad

      - name: "Gate: the packaged app launches and its core answers"
        run: node scripts/smoke-plus-mac-app.mjs "release/mac-arm64/OpenMausBot Plus.app"

      - name: Write the Plus update manifest
        id: manifest
        run: |
          set -euo pipefail
          v="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          dmg="OpenMausBot-Plus-$v-arm64.dmg"
          size=$(stat -f %z "release/$dmg")
          sha=$(openssl dgst -sha512 -binary "release/$dmg" | base64 | tr -d '\n')
          node -e 'const [v,d,s,h,u]=process.argv.slice(1);require("fs").writeFileSync("release/plus-update.json",JSON.stringify({version:v,dmg:d,size:Number(s),sha512:h,url:u},null,2)+"\n")' \
            "$v" "$dmg" "$size" "$sha" "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$dmg"
          cat release/plus-update.json
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "### Plus $v: $dmg $(( size / 1048576 )) MB" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the plus-* release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          v="${{ steps.version.outputs.version }}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag already exists; rerun with the next plus_build"; exit 1
          fi
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OpenMausBot Plus $v" \
            --notes "Private Plus build $v on upstream $(echo "$v" | cut -d- -f1). Apple Silicon only, unsigned: first launch with right-click > Open. Plus 0.1.104-plus.1 and later find newer plus-* releases by themselves." \
            "release/${{ steps.manifest.outputs.dmg }}" release/plus-update.json

      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenMausBot-Plus-arm64-dmg
          path: |
            release/OpenMausBot-Plus-*-arm64.dmg
            release/plus-update.json
            release/plus-smoke.png
          if-no-files-found: warn
          retention-days: 14
